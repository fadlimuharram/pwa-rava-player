<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the layout reach under the iPhone's rounded corners,
         with env(safe-area-inset-*) padding the content back out. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="description" content="Offline local music player. Your files, your phone, no account." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d10" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS still reads these; the manifest alone is not enough on older versions. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rava Music" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Rava Music</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Rava Music needs JavaScript to play your music.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
